      { name: 'Стандарт, 2-местный', desc: 'Две кровати, балкон · питание 3 раза · лечение', k: 1, left: x.left },
      { name: 'Полулюкс', desc: 'Гостиная зона · улучшенное питание · расширенная программа', k: 1.55, left: 1 }
    ].map(function (r, i) {
      var low = r.left <= 3;
      return { name: r.name, desc: r.desc, price: x.price * r.k, priceStr: fmt(x.price * r.k),
        leftLabel: low ? 'Осталось ' + r.left + ' ' + plural(r.left, 'номер', 'номера', 'номеров') + ' на эти даты' : 'Свободно ' + r.left + ' номеров',
        leftCls: low ? 'left-low' : 'left-ok', choose: function () { self.go('book', { roomIdx: i }); } };
    });
  }

  renderVals() {
    var s = this.state, self = this, a = s.ans, t = T[s.lang];

    // ----- assistant steps -----
    var diagOpts = [];
    a.systems.forEach(function (sy) { (DIAGS[sy] || []).forEach(function (d) { diagOpts.push(d); }); });
    diagOpts.push(['none', 'Диагноза нет / не знаю']);
    var STEPS = [
      { key: 'goal', q: 'Какова основная цель поездки?', opts: GOAL_OPTS },
      { key: 'systems', q: 'Что беспокоит?', multi: true, opts: SYSTEMS.map(function (x) { return [x.id, x.label]; }) },
      { key: 'diags', q: 'Есть ли диагноз от врача?', hint: 'Отметьте подходящие — с диагнозом подбор точнее. Список зависит от выбранных жалоб.', multi: true, opts: diagOpts, isDiag: true },
      { key: 'age', q: 'Сколько лет пациенту?', hint: 'Возраст влияет на допустимые процедуры.', opts: AGE_OPTS },
      { key: 'contra', q: 'Есть ли что-то из этого?', hint: 'Это важно для безопасности: часть процедур при этом противопоказана. Можно выбрать несколько.', multi: true, opts: CONTRA_OPTS },
      { key: 'region', q: 'Где удобнее пройти лечение?', opts: REGION_OPTS },
      { key: 'budget', q: 'Какой бюджет на человека в сутки (проживание, питание, лечение)?', opts: BUDGET_OPTS }
    ];
    var STEP_NAMES = ['Цель', 'Жалобы', 'Диагноз', 'Возраст', 'Противопоказания', 'Регион', 'Бюджет'];
    var DESCS = {
      treat: 'Плановое лечение того, что беспокоит давно', rehab: 'Реабилитация после COVID, операции, инфаркта, инсульта', prev: 'Без конкретного диагноза — для поддержания здоровья',
      none: 'Подберём по жалобам', no: 'Противопоказаний нет', acute: 'Санаторное лечение проводится вне обострения'
    };
    var asking = s.step < STEPS.length && !s.analyzing;
    var cur = { opts: [], groups: [], q: '', hint: '', isDiag: false, notDiag: true, next: null, back: null, nextCls: 'btn btn-off', nextLabel: 'Далее' };
    if (asking) {
      var st = STEPS[s.step];
      var exclusive = { none: 1, no: 1 };
      var mkOpt = function (o) {
        var on = s.sel.indexOf(o[0]) >= 0;
        return {
          label: o[1], desc: DESCS[o[0]] || '', on: on,
          cls: on ? 'opt opt-on' : 'opt',
          boxCls: st.multi ? (on ? 'box box-on' : 'box') : (on ? 'rad rad-on' : 'rad'),
          pick: function () {
            if (!st.multi) { self.setState({ sel: [o[0]] }); return; }
            var sel = s.sel.slice();
            if (on) sel = sel.filter(function (v) { return v !== o[0]; });
            else if (exclusive[o[0]]) sel = [o[0]];
            else sel = sel.filter(function (v) { return !exclusive[v]; }).concat([o[0]]);
            self.setState({ sel: sel });
          }
        };
      };
      var groups = [];
      if (st.isDiag) {
        a.systems.forEach(function (sy) { groups.push({ label: sysLabel(sy), opts: (DIAGS[sy] || []).map(mkOpt) }); });
        groups.push({ label: 'Если диагноза нет', opts: [mkOpt(['none', 'Диагноза нет / не знаю'])] });
      }
      var canNext = s.sel.length > 0 || (st.isDiag && s.file);
      var presetFor = function (idx, ans) {
        var k = STEPS[idx].key, v = ans[k];
        return STEPS[idx].multi ? (v || []).slice() : (v ? [v] : []);
      };
      cur = {
        q: st.q, hint: st.hint || (st.multi ? 'Можно выбрать несколько вариантов.' : 'Выберите один вариант.'),
        isDiag: !!st.isDiag, notDiag: !st.isDiag, groups: groups,
        opts: st.isDiag ? [] : st.opts.map(mkOpt),
        nextCls: canNext ? 'btn' : 'btn btn-off',
        nextLabel: s.step === STEPS.length - 1 ? 'Показать санатории' : 'Далее',
        back: function () {
          if (s.step === 0) { self.go('home'); return; }
          self.setState({ step: s.step - 1, sel: presetFor(s.step - 1, s.ans) });
        },
        next: function () {
          if (!canNext) return;
          var p = {}; p[st.key] = st.multi ? s.sel.slice() : s.sel[0];
          var newAns = Object.assign({}, s.ans, p);
          var nextStep = s.step + 1;
          if (nextStep >= STEPS.length) {
            self.setState({ ans: newAns, step: nextStep, sel: [], analyzing: true });
            setTimeout(function () { self.setState({ analyzing: false, finished: true }); self.go('results'); }, 1300);
          } else {
            self.setState({ ans: newAns, step: nextStep, sel: presetFor(nextStep, newAns) });
          }
          try { window.scrollTo(0, 0); } catch (e) {}
        }
      };
    }
    var ev = this.evaluate();
    var results = ev.list.map(function (r, idx) {
      return { name: r.x.name, region: r.x.region, rating: r.x.rating, reviews: r.x.reviews, color: r.x.color, score: r.score, why: r.why,
        priceStr: fmt(r.x.price), badge: idx === 0 ? 'Лучшее совпадение' : '#' + (idx + 1),
        open: function () { self.go('detail', { sanId: r.x.id, tab: 'treat' }); },
        book: function () { self.go('book', { sanId: r.x.id, roomIdx: 1 }); } };
    });
    var scoreOf = {}; ev.list.forEach(function (r) { scoreOf[r.x.id] = r.score; });
    var profileRows = [
      ['Цель', lab(GOAL_OPTS, a.goal)], ['Что беспокоит', a.systems.map(sysLabel).join(', ')],
      ['Диагноз', a.diags.map(function (d) { return DIAG_LABEL[d] || 'нет / не знаю'; }).join(', ') + (s.file ? (a.diags.length ? ' + выписка' : 'выписка загружена') : '')],
      ['Возраст', lab(AGE_OPTS, a.age)], ['Противопоказания', a.contra.map(function (c) { return lab(CONTRA_OPTS, c); }).join(', ')],
      ['Регион', lab(REGION_OPTS, a.region)], ['Бюджет в сутки', lab(BUDGET_OPTS, a.budget)]
    ].map(function (r) { return { label: r[0], val: r[1] || '—' }; });

    // ----- sanatorium detail -----
    var x = SAN.filter(function (v) { return v.id === s.sanId; })[0] || SAN[0];
    var contra = ['Онкологические заболевания', 'Острые инфекции и обострения хронических заболеваний', 'Психические расстройства в острой фазе'];
    if (x.radon) contra.push('Беременность (радоновые ванны)');
    if (x.mud) contra.push('Тяжёлые сердечно-сосудистые нарушения (грязелечение)');
    var san = {
      name: x.name, region: x.region, rating: x.rating, reviews: x.reviews, color: x.color, rank: x.rank,
      priceStr: fmt(x.price), hasScore: s.finished && scoreOf[x.id] > 0, score: scoreOf[x.id] || 0,
      treat: x.profiles.map(function (p) { return { label: sysLabel(p), procs: sysProcs(p), diags: (DIAGS[p] || []).map(function (d) { return d[1]; }).join(', ') }; }),
      contraStr: contra.join(' · '),
      rooms: this.roomsOf(x)
    };
    var room = san.rooms[s.roomIdx] || san.rooms[1];
    var total = room.price * 10 * s.guests;
    var TABS = [['treat', 'Лечение'], ['rooms', 'Номера и цены'], ['reviews', 'Отзывы'], ['doctors', 'Врачи']];
    var DOCS = [{ spec: 'Врач-курортолог' }, { spec: 'Физиотерапевт' }, { spec: 'Кардиолог-реабилитолог' }];
    var SLOTS_T = [['t1', '17:00', true], ['t2', '18:30', false], ['t3', '19:30', false], ['t4', '21:00', false]];
    var SLOTS_M = [['m1', '09:00', false], ['m2', '10:30', false], ['m3', '12:00', true], ['m4', '15:30', false]];
    var mkSlot = function (sl, day) {
      return { label: sl[1], cls: sl[2] ? 'slot slot-off' : (s.slot === sl[0] ? 'slot slot-on' : 'slot'),
        pick: function () { if (!sl[2]) self.setState({ slot: sl[0] }); }, day: day };
    };
    var slotLabel = '';
    SLOTS_T.forEach(function (sl) { if (sl[0] === s.slot) slotLabel = 'сегодня в ' + sl[1]; });
    SLOTS_M.forEach(function (sl) { if (sl[0] === s.slot) slotLabel = 'завтра в ' + sl[1]; });
    var fmtLabel = { video: 'видеозвонок', chat: 'чат', call: 'телефонный звонок' }[s.fmt];

    var regList = SAN.filter(function (v) { return !s.regFilter || v.profiles.indexOf(s.regFilter) >= 0; })
      .sort(function (p, q) { return q.rating - p.rating; })
      .map(function (v) { return { name: v.name, region: v.region, rating: v.rating, color: v.color, priceStr: fmt(v.price),
        tags: v.profiles.map(function (p) { return { label: sysLabel(p) }; }), open: function () { self.go('detail', { sanId: v.id, tab: 'treat' }); } }; });

    var navCls = function (on) { return on ? 'lnk lnk-on' : 'lnk'; };
    var payObj = PAYS.filter(function (p) { return p[0] === s.pay; })[0];
    var aSummary = [a.systems.map(sysLabel).join(', '), lab(AGE_OPTS, a.age) ? 'возраст ' + lab(AGE_OPTS, a.age) : '', lab(BUDGET_OPTS, a.budget)].filter(Boolean).join(' · ');

    return {
      t: t,
      langKzCls: s.lang === 'kz' ? 'lang lang-on' : 'lang', langRuCls: s.lang === 'ru' ? 'lang lang-on' : 'lang',
      setKz: function () { self.setState({ lang: 'kz' }); }, setRu: function () { self.setState({ lang: 'ru' }); },
      navPickCls: navCls(s.screen === 'assistant' || s.screen === 'results'), navRegCls: navCls(s.screen === 'registry'), navDocCls: navCls(s.screen === 'consult'),
      isHome: s.screen === 'home', isAssistant: s.screen === 'assistant', isResults: s.screen === 'results', isRegistry: s.screen === 'registry',
      isDetail: s.screen === 'detail', isConsult: s.screen === 'consult', isBook: s.screen === 'book', isDone: s.screen === 'done',
      goHome: function () { self.go('home'); },
      goAssistant: function () { self.go(s.finished ? 'results' : 'assistant'); },
      goRegistry: function () { self.go('registry'); },
      goConsultAny: function () { self.go('consult', { consultDone: false }); },
      goResults: function () { self.go('results'); },
      goResultsOrAssistant: function () { self.go(s.finished ? 'results' : 'assistant'); },
      backToChat: function () { self.go('assistant', { step: 0, sel: a.goal ? [a.goal] : [] }); },
      backToDetail: function () { self.go('detail'); },
      goBackFromDetail: function () { self.go(s.prev === 'registry' || s.prev === 'home' ? s.prev : (s.finished ? 'results' : 'registry')); },
      backLabel: s.prev === 'home' ? 'На главную' : (s.prev === 'registry' || !s.finished ? 'К реестру санаториев' : 'К подборке'),

      how: t.how.map(function (h, i) { return { n: '0' + (i + 1), title: h[0], desc: h[1] }; }),
      features: t.feats.map(function (f) { return { label: f }; }),
      top: RANKED.slice(0, 4).map(function (v) { return { name: v.name, region: v.region, rating: v.rating, color: v.color, rank: v.rank,
        profilesStr: v.profiles.map(sysLabel).join(' · '), open: function () { self.go('detail', { sanId: v.id, tab: 'treat' }); } }; }),

      stepNum: Math.min(s.step + 1, 7), progress: Math.round(Math.min(s.step, 7) / 7 * 100) + '%',
      stepName: STEP_NAMES[Math.min(s.step, 6)],
      asking: asking, cur: cur, analyzing: s.analyzing, finished: s.finished,
      restart: function () { self.setState({ step: 0, sel: [], finished: false, analyzing: false, file: false, ans: { goal: null, systems: [], diags: [], age: null, contra: [], region: null, budget: null } }); },
      addFile: function () { self.setState({ file: true }); },
      fileTitle: s.file ? '✓ Выписка_врача.pdf прикреплена' : 'Приложить выписку или заключение врача',
      profileRows: profileRows,

      results: results, resCountLabel: results.length + ' ' + plural(results.length, 'санаторий', 'санатория', 'санаториев'),
      summary: aSummary || 'По вашим ответам',
      hasAcute: a.contra.indexOf('acute') >= 0,
      hasExcluded: ev.excluded.length > 0, excluded: ev.excluded, excludedCount: ev.excluded.length,

      regCount: SAN.length + ' ' + plural(SAN.length, 'санаторий', 'санатория', 'санаториев'),
      regChips: [['', 'Все']].concat(SYSTEMS.map(function (v) { return [v.id, v.label]; })).map(function (c) {
        return { label: c[1], cls: s.regFilter === c[0] ? 'chip chip-sm chip-on' : 'chip chip-sm', pick: function () { self.setState({ regFilter: c[0] }); } };
      }),
      registry: regList,

      san: san, room: room, totalStr: fmt(total),
      tabs: TABS.map(function (tb) { return { label: tb[1], cls: s.tab === tb[0] ? 'tab tab-on' : 'tab', pick: function () { self.setState({ tab: tb[0] }); } }; }),
      tabTreat: s.tab === 'treat', tabRooms: s.tab === 'rooms', tabReviews: s.tab === 'reviews', tabDoctors: s.tab === 'doctors',
      showRooms: function () { self.setState({ tab: 'rooms' }); },
      scores: [{ label: 'Эффект от лечения', val: '4.8', pct: '96%' }, { label: 'Питание', val: '4.5', pct: '90%' }, { label: 'Номера', val: '4.4', pct: '88%' }, { label: 'Персонал', val: '4.9', pct: '98%' }],
      reviewStubs: x.profiles.slice(0, 2).map(function (p) { return { profile: sysLabel(p) }; }),
      doctors: DOCS.map(function (d, i) { return { spec: d.spec, consult: function () { self.go('consult', { doc: i, consultDone: false }); } }; }),

      consultForm: !s.consultDone, consultDone: s.consultDone,
      doctorsPick: DOCS.map(function (d, i) { return { spec: d.spec, cls: s.doc === i ? 'opt opt-on' : 'opt', pick: function () { self.setState({ doc: i }); } }; }),
      formats: [['video', 'Видеозвонок'], ['chat', 'Чат'], ['call', 'Звонок']].map(function (f) {
        return { label: f[1], cls: s.fmt === f[0] ? 'chip chip-on' : 'chip', pick: function () { self.setState({ fmt: f[0] }); } };
      }),
      slotsToday: SLOTS_T.map(function (sl) { return mkSlot(sl); }), slotsTomorrow: SLOTS_M.map(function (sl) { return mkSlot(sl); }),
      consultBtnCls: s.slot ? 'btn' : 'btn btn-off',
      confirmConsult: function () { if (s.slot) { self.setState({ consultDone: true }); try { window.scrollTo(0, 0); } catch (e) {} } },
      slotLabel: slotLabel,
      consultDoneText: DOCS[s.doc].spec + ', формат — ' + fmtLabel + '.',

      guests: s.guests, guestsLabel: s.guests + ' ' + (s.guests === 1 ? 'взрослый' : 'взрослых'),
      guestMinus: function () { self.setState({ guests: Math.max(1, s.guests - 1) }); },
      guestPlus: function () { self.setState({ guests: Math.min(4, s.guests + 1) }); },
      pays: PAYS.map(function (p) { return { title: p[1], desc: p[2], on: s.pay === p[0], cls: s.pay === p[0] ? 'opt opt-on' : 'opt', pick: function () { self.setState({ pay: p[0] }); } }; }),
      consent: s.consent, toggleConsent: function () { self.setState({ consent: !s.consent }); },
      payCls: s.consent ? 'btn' : 'btn btn-off',
      submit: function () { if (s.consent) self.go('done'); },
      payTitle: payObj ? payObj[1] : 'Kaspi',
      timeline: [
        { title: 'Заявка создана', desc: 'Сегодня', dot: 'dot dot-done' },
        { title: 'Подтверждение санатория', desc: 'Проверяем наличие номера', dot: 'dot dot-now' },
        { title: 'Оплата онлайн', desc: 'Ссылка придёт после подтверждения', dot: 'dot dot-next' },
        { title: 'Заезд 15 ноября', desc: 'Путёвка, памятка и контакты врача — в личном кабинете', dot: 'dot dot-next' }
      ],

      supportOpen: s.support, toggleSupport: function () { self.setState({ support: !s.support }); }
    };
  }
}
